      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5865F2" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <!-- Cyber Grid -->
  <g stroke="rgba(88, 101, 242, 0.12)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>
  <!-- Discord Bot Mascot & Terminal -->
  <rect x="80" y="70" width="640" height="310" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#5865F2" stroke-width="2" />
  <circle cx="115" cy="100" r="6" fill="#f43f5e" />
  <circle cx="135" cy="100" r="6" fill="#fbbf24" />
  <circle cx="155" cy="100" r="6" fill="#34d399" />
  <text x="180" y="105" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="14">discord_qa_bot — CrewAI Multi-Agent System</text>
  
  <!-- Network Nodes -->
  <circle cx="200" cy="220" r="30" fill="#5865F2" fill-opacity="0.25" stroke="#5865F2" stroke-width="2" />
  <text x="200" y="225" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle" font-weight="bold">Scanner</text>
  
  <line x1="230" y1="220" x2="370" y2="220" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5,5" />
  
  <circle cx="400" cy="220" r="36" fill="#0ea5e9" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2" />
  <text x="400" y="225" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" text-anchor="middle" font-weight="bold">Gemini 3.1</text>
  
  <line x1="436" y1="220" x2="570" y2="220" stroke="#34d399" stroke-width="2" stroke-dasharray="5,5" />
  
  <circle cx="600" cy="220" r="30" fill="#10b981" fill-opacity="0.25" stroke="#34d399" stroke-width="2" />
  <text x="600" y="225" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle" font-weight="bold">Patch PR</text>

  <!-- Live Terminal Logs -->
  <rect x="120" y="280" width="560" height="75" rx="8" fill="#030712" stroke="rgba(255,255,255,0.08)" />
  <text x="140" y="308" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="13">✓ Target probe: HTTP 200 OK | Latency: 42ms</text>
  <text x="140" y="333" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13">⚡ Automated Remediation Agent initialized. Discord webhook synced.</text>
