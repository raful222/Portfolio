<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="pulseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#pulseBg)" />
  <!-- Pulse Waveform -->
  <path d="M 0,225 L 200,225 L 240,130 L 280,320 L 320,170 L 360,260 L 400,225 L 800,225" fill="none" stroke="#ec4899" stroke-width="5" />
  <path d="M 0,225 L 200,225 L 240,130 L 280,320 L 320,170 L 360,260 L 400,225 L 800,225" fill="none" stroke="#f472b6" stroke-width="12" opacity="0.3" />
  
  <!-- Server Node Boxes -->
  <rect x="100" y="60" width="180" height="90" rx="10" fill="rgba(30, 41, 59, 0.85)" stroke="#38bdf8" stroke-width="2" />
  <text x="190" y="100" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="15" text-anchor="middle" font-weight="bold">.NET 10 Bus</text>
  <text x="190" y="125" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">&lt;2ms Latency</text>

  <rect x="520" y="60" width="180" height="90" rx="10" fill="rgba(30, 41, 59, 0.85)" stroke="#ef4444" stroke-width="2" />
  <text x="610" y="100" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="15" text-anchor="middle" font-weight="bold">Redis Cache</text>
  <text x="610" y="125" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">In-Memory Cluster</text>

  <rect x="310" y="310" width="180" height="90" rx="10" fill="rgba(30, 41, 59, 0.85)" stroke="#10b981" stroke-width="2" />
  <text x="400" y="350" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="15" text-anchor="middle" font-weight="bold">Docker Ingestion</text>
  <text x="400" y="375" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">High Concurrency</text>
</svg>