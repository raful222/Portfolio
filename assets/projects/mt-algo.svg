<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="mtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06121e" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#mtBg)" />
  <!-- Candlesticks -->
  <g stroke-width="2">
    <!-- Red Bearish -->
    <line x1="120" y1="180" x2="120" y2="310" stroke="#f43f5e" />
    <rect x="110" y="210" width="20" height="70" fill="#f43f5e" rx="2" />

    <!-- Green Bullish -->
    <line x1="170" y1="160" x2="170" y2="290" stroke="#10b981" />
    <rect x="160" y="190" width="20" height="80" fill="#10b981" rx="2" />

    <line x1="220" y1="140" x2="220" y2="270" stroke="#10b981" />
    <rect x="210" y="160" width="20" height="90" fill="#10b981" rx="2" />

    <!-- Red -->
    <line x1="270" y1="180" x2="270" y2="320" stroke="#f43f5e" />
    <rect x="260" y="200" width="20" height="90" fill="#f43f5e" rx="2" />

    <!-- Huge Green Breakout -->
    <line x1="330" y1="110" x2="330" y2="280" stroke="#10b981" />
    <rect x="320" y="130" width="20" height="120" fill="#10b981" rx="2" />

    <line x1="390" y1="90" x2="390" y2="230" stroke="#10b981" />
    <rect x="380" y="100" width="20" height="100" fill="#10b981" rx="2" />
    
    <line x1="450" y1="70" x2="450" y2="210" stroke="#10b981" />
    <rect x="440" y="80" width="20" height="100" fill="#10b981" rx="2" />

    <line x1="510" y1="110" x2="510" y2="240" stroke="#f43f5e" />
    <rect x="500" y="130" width="20" height="70" fill="#f43f5e" rx="2" />

    <line x1="570" y1="80" x2="570" y2="220" stroke="#10b981" />
    <rect x="560" y="90" width="20" height="110" fill="#10b981" rx="2" />

    <line x1="630" y1="60" x2="630" y2="190" stroke="#10b981" />
    <rect x="620" y="70" width="20" height="100" fill="#10b981" rx="2" />

    <line x1="690" y1="40" x2="690" y2="170" stroke="#10b981" />
    <rect x="680" y="50" width="20" height="90" fill="#10b981" rx="2" />
  </g>

  <!-- Moving Average Line -->
  <path d="M 80,310 Q 200,240 330,190 T 500,120 T 720,70" fill="none" stroke="#38bdf8" stroke-width="4" />
  <path d="M 80,340 Q 220,290 350,220 T 550,150 T 720,100" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="4,4" />

  <!-- Badge Header -->
  <rect x="40" y="30" width="240" height="38" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" />
  <text x="55" y="55" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold">MT-Algo Engine • +38.4%</text>
</svg>