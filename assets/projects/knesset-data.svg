<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="govBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#govBg)" />
  <!-- Parliament Hemicycle / Data Arc -->
  <circle cx="400" cy="350" r="220" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="12" stroke-dasharray="10,8" />
  <circle cx="400" cy="350" r="170" fill="none" stroke="rgba(99, 102, 241, 0.3)" stroke-width="12" stroke-dasharray="10,8" />
  <circle cx="400" cy="350" r="120" fill="none" stroke="rgba(16, 185, 129, 0.4)" stroke-width="12" stroke-dasharray="10,8" />
  <circle cx="400" cy="350" r="70" fill="none" stroke="#38bdf8" stroke-width="12" stroke-dasharray="10,8" />

